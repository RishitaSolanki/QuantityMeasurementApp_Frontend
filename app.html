<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Measurement App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-brand"><span>⚖️</span> Quantity Measurement</div>
  <div class="nav-actions">
    <span class="nav-user" id="navUser"></span>
    <button class="btn-nav outline" id="logoutBtn">Logout</button>
  </div>
</nav>

<div class="app-container">

  <!-- Guest Banner -->
  <div class="guest-banner" id="guestBanner" style="display:none">
    ⚠️ You're in guest mode. History is saved in session only.
    <a id="loginFromBanner">Login to save permanently →</a>
  </div>

  <!-- Measurement Card -->
  <div class="card">
    <div class="card-title">📐 Measurement Calculator</div>

    <!-- Type Tabs -->
    <div class="type-tabs" id="typeTabs"></div>

    <!-- Operation Tabs -->
    <div class="op-tabs" id="opTabs"></div>

    <!-- Normal Inputs (ADD / SUBTRACT / DIVIDE / COMPARE) -->
    <div id="normalInputs" class="input-grid">
      <div>
        <div class="form-group">
          <label>Value 1</label>
          <input type="number" id="val1" placeholder="e.g. 10" step="any" />
        </div>
        <div class="form-group">
          <label>Unit 1</label>
          <select id="unit1"></select>
        </div>
      </div>
      <div class="op-symbol" id="opSymbol">+</div>
      <div>
        <div class="form-group">
          <label>Value 2</label>
          <input type="number" id="val2" placeholder="e.g. 5" step="any" />
        </div>
        <div class="form-group">
          <label>Unit 2</label>
          <select id="unit2"></select>
        </div>
      </div>
    </div>

    <!-- Convert Inputs -->
    <div id="convertInputs" class="convert-row" style="display:none">
      <div>
        <div class="form-group">
          <label>Value</label>
          <input type="number" id="convertVal" placeholder="e.g. 100" step="any" />
        </div>
        <div class="form-group">
          <label>From Unit</label>
          <select id="convertUnit"></select>
        </div>
      </div>
      <div class="arrow-symbol">→</div>
      <div>
        <div class="form-group" style="padding-top:1.6rem">
          <label>To Unit</label>
          <select id="targetUnit"></select>
        </div>
      </div>
    </div>

    <button class="btn-primary" id="calcBtn" style="margin-top:0.5rem">Calculate</button>

    <!-- Result -->
    <div class="result-box" id="resultBox">
      <div class="result-label">Result</div>
      <div class="result-value" id="resultValue"></div>
    </div>
  </div>

  <!-- History Card -->
  <div class="card">
    <div class="history-header">
      <div class="card-title" style="margin-bottom:0">🕓 History</div>
      <button class="btn-clear" id="clearHistoryBtn">Clear</button>
    </div>
    <ul class="history-list" id="historyList"></ul>
  </div>

</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
